{% extends "base.html" %}
{% block title %}New Supplier — Jewelry ERP{% endblock %}

{% block head %}
<style>
    form.supplier-form input { width:100%; }
</style>
{% endblock %}

{% block content %}
<h1>New Supplier</h1>

<form method="post" class="card supplier-form" style="max-width:560px;">
    {% csrf_token %}

    <label for="name">Name *</label>
    <input type="text" id="name" name="name" required>

    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="notes">Notes</label>
    <input type="text" id="notes" name="notes">

    <button type="submit" class="btn" style="margin-top:20px;">Save supplier</button>
</form>

<div class="card" style="margin-top:22px;">
    <h2>Existing suppliers</h2>
    <table class="list">
        {% for s in suppliers %}
        <tr><td>{{ s.name }}</td><td class="num">{{ s.phone }}</td></tr>
        {% empty %}
        <tr><td class="sub">No suppliers yet.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
